<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iStoreGrozny — макеты баннера</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #eaeaec; color: #242426; font: 14px system-ui, sans-serif }
main { width: min(1300px, 100% - 24px); margin: 24px auto }
h1 { font-size: 26px }
.samples > section:first-child { grid-column: 1 / -1 }
.samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 22px }
h2 { margin: 0 0 8px; font-size: 15px }
.banner { container-type: inline-size; max-width: 440px; overflow: hidden }
.layout { display: grid; grid-template-columns: 1fr 1fr; min-height: 220px; align-items: center; background: #242426; color: white }
.copy, .info { min-width: 0; padding: 14px }
.copy h3 { font-size: clamp(15px, 4.5cqw, 20px); line-height: 1.24; font-weight: 650; letter-spacing: -.02em; text-wrap: balance; margin: 0 0 8px }
.copy p { margin: 0; font-size: clamp(9.9px, 2.79cqw, 12.6px); color: #dedee2; line-height: 1.5; text-wrap: pretty }
.info { display: grid; gap: 6px; font-size: clamp(10px, 3cqw, 13px); line-height: 1.4 }
.info a { color: inherit; text-decoration: none }
.info a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px }
.info a:active { opacity: .65 }
.phone { font-weight: 700; white-space: nowrap }
.card .layout { grid-template-columns: minmax(0, 1fr) max-content; background: #f5f5f7; color: #242426 }
.card .info { white-space: nowrap; background: #e5e5e9; border: 1px solid #d2d2d7; border-radius: 12px; margin: 8px; padding: 10px }
.logo-crop { position: relative; width: min(120px, 100%); aspect-ratio: 104 / 42; overflow: hidden; mix-blend-mode: screen; }
.logo-crop img { position: absolute; width: 144.23%; max-width: none; left: -22.12%; top: -128.57%; }
.banner-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px }
.banner-actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 6px 9px; border: 1px solid #ffffff60; border-radius: 7px; color: white; text-decoration: none; font-size: 11px; font-weight: 600; transition: transform 160ms ease, opacity 160ms ease }
.banner-actions a:first-child { background: white; color: #242426 }
.banner-actions a:active { transform: scale(.97); opacity: .8 }
.banner-actions a:focus-visible { outline: 2px solid white; outline-offset: 2px }
@media (prefers-reduced-motion: reduce) {
  .banner-actions a { transition: none }
  .banner-actions a:active { transform: none }
}
.split .info { border-left: 1px solid #ffffff38 }
.silver .layout { background: #f5f5f7; color: #242426 }
.silver .info { background: #e5e5e9; align-self: stretch; align-content: center }
.card .logo-crop, .silver .logo-crop { mix-blend-mode: multiply; filter: invert(1) }
.gradient .layout { background: linear-gradient(110deg, #201a21, #3e2a37 75%, #55404d) }
.gradient .info a:not(.phone) { color: #f2dce9 }
.phone-first .layout { background: #303033 }
.phone-first .info { align-self: stretch; align-content: center; background: #1c1c1e }
.phone-first .phone { border: 1px solid #ffffff60; border-radius: 7px; padding: 5px; text-align: center }
.card .copy { padding: 10px }
.card .copy h3 { line-height: 1.12; margin-bottom: 5px }
.card .copy p { color: #515155; line-height: 1.32 }
.card .banner-actions { margin-top: 8px }
.card .banner-actions a { color: #242426; border-color: #8d8d94 }
.card .banner-actions a:first-child { background: #242426; color: white; border-color: #242426 }
.card .banner-actions a:focus-visible { outline-color: #242426 }
</style>
<main><h1>Первый баннер · О магазине</h1><div class="samples"></div></main>
<script>
const variants = [
  ['card', 'Контакты в отдельной карточке'],
  ['split', 'Графитовый с разделителем'],
  ['silver', 'Светлый с серебристым блоком'],
  ['gradient', 'Графитовый с бордовым оттенком'],
  ['phone-first', 'Тёмный с выделенной кнопкой звонка'],
];
document.querySelector('.samples').innerHTML = variants.map(([style, title]) => `
  <section>
    <h2>${title}</h2>
    <div class="banner ${style}"><div class="layout">
      <div class="copy">
        ${style === "card" ? `<h3>Магазин техники Apple и аксессуаров в Грозном.</h3>
        <p>Наша команда поможет вам выбрать идеальный продукт, настроить и наклеить защитную пленку</p>
        <div class="banner-actions">
          <a href="../index.html#catalog">Каталог</a>
          <a href="tel:+79380000391">Позвонить</a>
        </div>` : `<h3>Техника Apple<br>в Грозном</h3><p>Поможем выбрать iPhone, MacBook, iPad и аксессуары.</p>`}
      </div>
      <div class="info">
        <div class="logo-crop"><img src="store-logo-source.png" alt="iStoreGrozny"></div>
        <a href="https://yandex.ru/maps/?text=Грозный%2C%20Германа%20Угрюмова%2C%2080">ул. Германа Угрюмова, 80</a>
        <a href="https://yandex.ru/maps/?text=Грозный%2C%20Назарбаева%2C%20100">ул. Назарбаева, 100</a>
        <a class="phone" href="tel:+79380000391">+7 (938) 000-03-91</a>
        <span>Ежедневно, 09:00–21:00</span>
      </div>
    </div></div>
  </section>`).join('');
</script>
</html>
